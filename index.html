<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cricket Army | Live Scores, News, Videos &amp; Rankings</title>
  <meta name="description" content="Cricket Army: live cricket scores, match schedules, news, videos, series and ICC rankings.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <div class="ticker" id="ticker" aria-label="Live scores"></div>

  <main class="container">
    <section class="hero" id="hero"></section>
    <section class="block" id="live-matches"></section>
    <div class="two-col">
      <section class="block" id="latest-news"></section>
      <aside class="sidebar">
        <section class="block" id="rankings"></section>
        <section class="block" id="points-table"></section>
      </aside>
    </div>
    <section class="block" id="videos"></section>
    <section class="block" id="series"></section>
    <section class="block" id="photos"></section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  
  
  <script src="index.js"></script>
</body>
</html>
